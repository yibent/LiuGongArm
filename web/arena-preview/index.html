<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiuGong · Panda 仿真观察台</title>
<style>
:root{color-scheme:dark;--bg:#131918;--line:#35403b;--muted:#a6b0a9;--accent:#efc651}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf1eb;font:15px/1.6 "IBM Plex Sans","PingFang SC",sans-serif}header,main,footer{max-width:1480px;margin:auto;padding:28px 40px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{letter-spacing:.18em;font:600 12px "IBM Plex Mono",monospace;color:var(--accent)}h1{font-size:30px;font-weight:500;letter-spacing:-.04em;margin:8px 0}a{color:inherit;text-underline-offset:5px}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:24px}.feed{margin:0;background:#0b100e;border:1px solid var(--line);position:relative;overflow:hidden}.feed img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain}.feed figcaption{display:flex;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.feed figcaption b{color:#edf1eb;letter-spacing:.08em;font-weight:500}.secondary{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.rail{padding:0 0 0 16px}.rail h2{font-size:13px;font-weight:500;letter-spacing:.13em;color:var(--muted);margin:0 0 18px}.status{font-size:24px;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:26px}.row{display:grid;grid-template-columns:100px 1fr;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.row span{color:var(--muted)}.row b{font-weight:400;overflow-wrap:anywhere}.layers{margin-top:35px}.layer{border-left:2px solid var(--accent);padding:5px 0 5px 16px;margin:16px 0}.layer small{display:block;color:var(--muted)}footer{color:var(--muted);font-size:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px}@media(max-width:850px){header,main,footer{padding:20px}main{grid-template-columns:1fr}.rail{padding:0}.secondary{gap:8px}header{gap:20px}h1{font-size:24px}footer{display:block}}
</style>
<header><div><div class="brand">LIUGONG / SIMULATION 01</div><h1>Panda 仿真观察台</h1></div><a id="console" href="#">打开 BusAgent ↗</a></header>
<main><section aria-label="实时相机"><figure class="feed"><img id="scene" alt="场景 RGB-D 相机实时画面"><figcaption><b>01 / 工作区</b><span>RGB-D · WORLD VIEW</span></figcaption></figure><div class="secondary"><figure class="feed"><img id="side" alt="侧面 RGB-D 相机实时画面"><figcaption><b>02 / 侧视</b><span>RGB-D</span></figcaption></figure><figure class="feed"><img id="wrist" alt="Panda 腕部 RGB-D 相机实时画面"><figcaption><b>03 / 腕部</b><span>RGB-D</span></figcaption></figure></div></section>
<aside class="rail"><h2>执行状态 / LIVE STATE</h2><div class="status" role="status"><span class="dot"></span><span id="phase">正在连接仿真</span></div><div class="row"><span>机械臂</span><b>Franka Panda · 7 DoF</b></div><div class="row"><span>任务编号</span><b id="command">—</b></div><div class="row"><span>持物状态</span><b id="held">—</b></div><div class="row"><span>观测序号</span><b id="sequence">—</b></div><div class="row"><span>末端位置</span><b id="tcp">—</b></div><div class="layers"><h2>任务分工</h2><div class="layer">BusAgent / VLM<small>任务理解、目标选择与步骤决策</small></div><div class="layer">官方快速抓放<small>简单任务优先；失败后自动升级</small></div><div class="layer">GraspGenX · AnyPlace<small>困难任务的抓取与放置姿态生成</small></div><div class="layer">IsaacLab-Arena<small>场景、相机、Panda IK 与任务评测</small></div></div></aside></main>
<footer><span>Isaac Sim 6 · 实时渲染图像 · 当前基准使用仿真语义分割</span><span id="updated">等待首帧</span></footer>
<script>
const consoleUrl=new URL('/',location.href);
if(!location.pathname.startsWith('/preview')) {
  if(location.hostname.includes('-8993.')) consoleUrl.hostname=location.hostname.replace('-8993.','-8991.');
  else consoleUrl.port=location.port==='18993'?'18991':'8991';
}
document.getElementById('console').href=consoleUrl.href;
const phases={observation:'更新点云',settle_grasp:'稳定夹持',finish:'验证结果',attempt_started:'开始执行',attempt_finished:'检查结果',model_fallback:'升级模型处理',fallback_keep_grasp:'保留抓取，升级放置',fallback_reobserve:'重新观察目标',fallback_retreat:'退离后重新抓取',support_contact:'已接触支撑面',idle:'待命',planning:'规划任务',pregrasp:'抓取前接近',approach:'接近目标',close_gripper:'闭合夹爪',lift:'抬升物体',lift_verified:'抬升已验证',placement_inference:'生成放置姿态',transport:'搬运物体',place_approach:'对齐放置',release:'释放物体',retreat:'撤离',selected_grasp:'已选抓取姿态',selected_placement:'已选放置姿态'};
async function refresh(){try{const response=await fetch('/api/status',{signal:AbortSignal.timeout(2500)});if(!response.ok)throw Error();const state=await response.json();document.getElementById('phase').textContent=phases[state.phase]||state.phase;document.getElementById('command').textContent=state.command_id||'—';document.getElementById('held').textContent=state.held_object||'未持物';document.getElementById('sequence').textContent=state.sequence;document.getElementById('tcp').textContent=state.tcp_pose_world?.slice(0,3).map(row=>row[3].toFixed(3)).join(' / ')+' m';document.getElementById('updated').textContent='更新于 '+new Date(state.timestamp*1000).toLocaleTimeString();for(const key of ['scene','side','wrist']){const node=document.getElementById(key);if(node.complete||!node.src)node.src='/api/frame/'+key+'.jpg?t='+state.sequence;}}catch{document.getElementById('phase').textContent='仿真暂未连接';}finally{setTimeout(refresh,800)}}refresh();
</script></html>
