; Loaded at container boot by /opt/supervisord.yaml's existing include glob.
[program:liugong-stack]
command=/usr/bin/supervisord -n -c /root/gpufree-data/arena-panda/ops/arena-supervisord.conf
directory=/root/gpufree-data/arena-panda
priority=50
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=180
stdout_logfile=/root/gpufree-data/arena-panda/output/supervisor/cloud-boot.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
