# Install as /etc/nginx/conf.d/liugong-arena.conf. Leaves the desktop :3000 intact.
server {
    listen 8991;
    root /root/gpufree-data/arena-panda/BusAgent/frontend/dist;
    location / { try_files $uri $uri/ /index.html; }
    location /preview/ { alias /root/gpufree-data/arena-panda/web/arena-preview/; }
    location /api/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:7861;
        proxy_read_timeout 5s;
    }
    location /v1/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }
}
server {
    listen 8993;
    root /root/gpufree-data/arena-panda/web/arena-preview;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:7861;
        proxy_read_timeout 5s;
    }
}
# 8999 is deliberately unused and reserved.
