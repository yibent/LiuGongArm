; Dedicated manager; the cloud platform keeps owning Xorg, nginx and SSH.
[unix_http_server]
file=%(here)s/../output/supervisor/control.sock
chmod=0700

[supervisord]
logfile=%(here)s/../output/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=%(here)s/../output/supervisor/supervisord.pid
childlogdir=%(here)s/../output/supervisor
directory=%(here)s/..
environment=BUSAGENT_NODE="/root/gpufree-data/tools/node/bin/node",DISPLAY=":20",XAUTHORITY="/home/ubuntu/.Xauthority",XDG_RUNTIME_DIR="/tmp/runtime-xdg",PYTHONUNBUFFERED="1"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../output/supervisor/control.sock

[program:database]
command=/usr/bin/python3 %(here)s/arena_supervisor.py database
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=%(here)s/../output/services/database.log
stdout_logfile_maxbytes=30MB
stdout_logfile_backups=3

[program:vision]
command=/usr/bin/python3 %(here)s/arena_supervisor.py vision
priority=20
autostart=true
