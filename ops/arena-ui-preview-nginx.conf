# Backup UI entry point, serving the same deployed build as port 8991.
# Install as /etc/nginx/conf.d/liugong-ui-preview.conf.
server {
    listen 8999;
    root /root/gpufree-data/arena-panda/BusAgent/frontend/dist;
    location / { try_files $uri $uri/ /index.html; }
    # Lifecycle mutations are disabled; never proxy this namespace to root.
    location = /api/system { return 404; }
    location ^~ /api/system/ { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:7861;
        proxy_read_timeout 15s;
        client_max_body_size 64k;
    }
    location = /v1/workspace/status {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:5599/status;
        proxy_read_timeout 3s;
    }
    location /v1/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }
}
