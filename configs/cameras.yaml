# Camera rig used by the simulation and the vision pipeline.
enabled: true
scene:
  # Keep the existing prim path for consumers; this camera now outputs RGB-D.
  prim_path: /World/Cameras/TableTopRGB
  resolution: [640, 480]
  frequency: 15
  position: [0.50, 0.0, 2.30]
  # Camera convention is +X forward. A +90 degree Y rotation looks down -Z.
  orientation_wxyz: [0.70710678, 0.0, 0.70710678, 0.0]
  target: [0.50, 0.0, 1.05]
  focal_length: 1.8
  clipping_range: [0.01, 10.0]
  annotators: [rgb, distance_to_image_plane, semantic_segmentation]
  # Optional fixed observer overlooking the work area from outside arm reach.
  # This is a camera-mount experiment, not an object-specific viewpoint.
  recovery_oblique:
    position: [0.65, -0.65, 1.75]
    target: [0.35, -0.15, 1.08]
placement:
  # Dedicated fixed observer used only after grasp handoff. Keeping this
  # sensor separate from the coarse/recovery camera prevents a placement
  # re-aim from invalidating the scene tracker and its render-pose contract.
  prim_path: /World/Cameras/PlacementRGB
  enabled: false
  resolution: [640, 480]
  frequency: 15
  position: [0.35, 0.55, 1.60]
  target: [0.28, -0.18, 1.09]
  look_at: true
  focal_length: 1.8
  clipping_range: [0.01, 10.0]
  annotators: [rgb, distance_to_image_plane, semantic_segmentation]
wrist:
  parent_prim_path: /World/SO101/gripper
  prim_path: /World/SO101/gripper/WristRGBD
  resolution: [640, 480]
  frequency: 15
  # Side-mounted to keep the gripper body out of the optical centre.
  # Chosen after merged-code close-range A/B tests (label_grasp runs 12/13).
  # Exact translation/orientation/focal length from successful pre-merge runs.
  # Author a real camera pose: never rotate RGB independently of depth and K.
  translation: [0.060, 0.0, -0.030]
  orientation_wxyz: [0.53895, 0.0, 0.84234, 0.0]
  focal_length: 1.8
  clipping_range: [0.01, 3.0]
  annotators: [rgb, distance_to_image_plane]
  # Comparison only, NEVER an automatic fallback: at the fine handoff the
  # wide profile looks almost horizontally and clips the target (run 13).
  profiles:
    tabletop_wide:
      translation: [0.150, 0.0, -0.100]
      orientation_wxyz: [0.0, 0.0, 1.0, 0.0]
      focal_length: 1.0
    fine_grasp:
      translation: [0.060, 0.0, -0.030]
      orientation_wxyz: [0.53895, 0.0, 0.84234, 0.0]
      focal_length: 1.8
