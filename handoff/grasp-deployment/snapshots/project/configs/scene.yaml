table_orient_wxyz: [0.70710678, 0.0, 0.0, 0.70710678]
robot_pos: [0.2, 0.0, 1.02]
# +90 degrees counter-clockwise around world Z, so the reachable half-plane
# faces the working area in front of the mounted arm.
